# Azure DevOps는 shared development 서버의 배포만 담당한다.
# Android/서버 PR CI는 계속 GitHub Actions(.github/workflows/ci.yml)에서 실행한다.
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - server/**
      - infra/azure/**
      - azure-pipelines.yml

# PR에서는 Azure 리소스·공유 개발 서버를 절대 바꾸지 않는다.
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: davi-server

stages:
  - stage: Build
    displayName: 서버 이미지 빌드
    jobs:
      - job: BuildImage
        displayName: ACR 이미지 빌드
        steps:
          - checkout: self

          # Azure DevOps Pipeline 변수에서 이름만 받는다. Gemini 키·개발 토큰은 절대 Pipeline에 주입하지 않는다.
          - task: AzureCLI@2
            displayName: Git commit 이미지 ACR push
            inputs:
              azureSubscription: $(DAVI_AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: false
              inlineScript: |
                set -euo pipefail
                test -n "$DAVI_AZURE_ACR_NAME"
                az acr build \
                  --registry "$DAVI_AZURE_ACR_NAME" \
                  --image "$(imageRepository):$(Build.SourceVersion)" \
                  --file Dockerfile \
                  server
            env:
              DAVI_AZURE_ACR_NAME: $(DAVI_AZURE_ACR_NAME)

  - stage: Deploy
    displayName: 개발 서버 배포
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployServer
        displayName: Container Apps revision 적용
        environment: davi-development
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Container App 배포
                  inputs:
                    azureSubscription: $(DAVI_AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: false
                    inlineScript: |
                      set -euo pipefail
                      for name in \
                        DAVI_AZURE_RESOURCE_GROUP \
                        DAVI_AZURE_ACR_NAME \
                        DAVI_AZURE_KEY_VAULT_NAME \
                        DAVI_AZURE_MANAGED_ENVIRONMENT_NAME \
                        DAVI_AZURE_CONTAINER_IDENTITY_NAME \
                        DAVI_AZURE_CONTAINER_APP_NAME; do
                        test -n "${!name:-}" || { echo "##vso[task.logissue type=error]$name Pipeline 변수를 설정하세요."; exit 1; }
                      done

                      az deployment group create \
                        --name "davi-server-$(Build.BuildId)" \
                        --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
                        --template-file infra/azure/dev-server.bicep \
                        --parameters \
                          containerAppName="$DAVI_AZURE_CONTAINER_APP_NAME" \
                          managedEnvironmentName="$DAVI_AZURE_MANAGED_ENVIRONMENT_NAME" \
                          acrName="$DAVI_AZURE_ACR_NAME" \
                          keyVaultName="$DAVI_AZURE_KEY_VAULT_NAME" \
                          containerIdentityName="$DAVI_AZURE_CONTAINER_IDENTITY_NAME" \
                          imageTag="$(Build.SourceVersion)"
                    env:
                      DAVI_AZURE_RESOURCE_GROUP: $(DAVI_AZURE_RESOURCE_GROUP)
                      DAVI_AZURE_ACR_NAME: $(DAVI_AZURE_ACR_NAME)
                      DAVI_AZURE_KEY_VAULT_NAME: $(DAVI_AZURE_KEY_VAULT_NAME)
                      DAVI_AZURE_MANAGED_ENVIRONMENT_NAME: $(DAVI_AZURE_MANAGED_ENVIRONMENT_NAME)
                      DAVI_AZURE_CONTAINER_IDENTITY_NAME: $(DAVI_AZURE_CONTAINER_IDENTITY_NAME)
                      DAVI_AZURE_CONTAINER_APP_NAME: $(DAVI_AZURE_CONTAINER_APP_NAME)

                # 인증 없는 health 응답의 고정 상태만 본다. 요청/응답 본문·키·토큰은 출력하지 않는다.
                - task: AzureCLI@2
                  displayName: HTTPS health 스모크
                  inputs:
                    azureSubscription: $(DAVI_AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: false
                    inlineScript: |
                      set -euo pipefail
                      fqdn="$(az containerapp show \
                        --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
                        --name "$DAVI_AZURE_CONTAINER_APP_NAME" \
                        --query 'properties.configuration.ingress.fqdn' \
                        --output tsv)"
                      test -n "$fqdn"
                      for attempt in $(seq 1 18); do
                        body="$(curl --fail --silent --show-error --max-time 10 "https://$fqdn/health" || true)"
                        if printf '%s' "$body" | jq -e '.status == "ok" and .environment == "development" and .stub_llm == false' >/dev/null; then
                          printf 'shared development URL: https://%s\n' "$fqdn"
                          exit 0
                        fi
                        sleep 10
                      done
                      echo '##vso[task.logissue type=error]Container App health 확인에 실패했습니다.'
                      exit 1
                    env:
                      DAVI_AZURE_RESOURCE_GROUP: $(DAVI_AZURE_RESOURCE_GROUP)
                      DAVI_AZURE_CONTAINER_APP_NAME: $(DAVI_AZURE_CONTAINER_APP_NAME)
