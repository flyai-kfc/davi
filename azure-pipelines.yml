# Azure DevOps는 공유 development 서버 배포만 담당한다.
# Android/서버 PR CI는 계속 GitHub Actions(.github/workflows/ci.yml)에서 실행한다.
trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - server/**
      - infra/azure/**
      - azure-pipelines.yml

# PR에서는 Azure 리소스와 공유 서버를 절대 변경하지 않는다.
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: davi-server

stages:
  - stage: Build
    displayName: 서버 이미지 빌드
    jobs:
      - job: BuildImage
        displayName: Docker image build와 ACR push
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Build ID 불변 tag로 ACR push
            inputs:
              azureSubscription: $(DAVI_AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: false
              inlineScript: |
                set -euo pipefail
                test -n "$DAVI_AZURE_ACR_NAME" || {
                  echo '##vso[task.logissue type=error]DAVI_AZURE_ACR_NAME Pipeline 변수를 설정하세요.'
                  exit 1
                }
                image_tag="$(Build.SourceVersion)-$(Build.BuildId)"
                login_server="$(az acr show \
                  --name "$DAVI_AZURE_ACR_NAME" \
                  --query loginServer \
                  --output tsv)"
                test -n "$login_server"

                az acr login --name "$DAVI_AZURE_ACR_NAME"
                docker build \
                  --platform linux/amd64 \
                  --file server/Dockerfile \
                  --tag "$login_server/$(imageRepository):$image_tag" \
                  server
                docker push "$login_server/$(imageRepository):$image_tag"
            env:
              DAVI_AZURE_ACR_NAME: $(DAVI_AZURE_ACR_NAME)

  - stage: Deploy
    displayName: 개발 서버 배포
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployServer
        displayName: Container Apps revision 적용
        environment: davi-development
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 고유 revision 배포
                  inputs:
                    azureSubscription: $(DAVI_AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: false
                    inlineScript: |
                      set -euo pipefail
                      for name in \
                        DAVI_AZURE_RESOURCE_GROUP \
                        DAVI_AZURE_ACR_NAME \
                        DAVI_AZURE_KEY_VAULT_NAME \
                        DAVI_AZURE_MANAGED_ENVIRONMENT_NAME \
                        DAVI_AZURE_CONTAINER_IDENTITY_NAME \
                        DAVI_AZURE_CONTAINER_APP_NAME; do
                        test -n "${!name:-}" || {
                          echo "##vso[task.logissue type=error]$name Pipeline 변수를 설정하세요."
                          exit 1
                        }
                      done

                      image_tag="$(Build.SourceVersion)-$(Build.BuildId)"
                      revision_suffix="r$(Build.BuildId)"
                      az deployment group create \
                        --name "davi-server-$(Build.BuildId)" \
                        --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
                        --template-file infra/azure/dev-server.bicep \
                        --parameters \
                          containerAppName="$DAVI_AZURE_CONTAINER_APP_NAME" \
                          managedEnvironmentName="$DAVI_AZURE_MANAGED_ENVIRONMENT_NAME" \
                          acrName="$DAVI_AZURE_ACR_NAME" \
                          keyVaultName="$DAVI_AZURE_KEY_VAULT_NAME" \
                          containerIdentityName="$DAVI_AZURE_CONTAINER_IDENTITY_NAME" \
                          imageTag="$image_tag" \
                          revisionSuffix="$revision_suffix"
                  env:
                    DAVI_AZURE_RESOURCE_GROUP: $(DAVI_AZURE_RESOURCE_GROUP)
                    DAVI_AZURE_ACR_NAME: $(DAVI_AZURE_ACR_NAME)
                    DAVI_AZURE_KEY_VAULT_NAME: $(DAVI_AZURE_KEY_VAULT_NAME)
                    DAVI_AZURE_MANAGED_ENVIRONMENT_NAME: $(DAVI_AZURE_MANAGED_ENVIRONMENT_NAME)
                    DAVI_AZURE_CONTAINER_IDENTITY_NAME: $(DAVI_AZURE_CONTAINER_IDENTITY_NAME)
                    DAVI_AZURE_CONTAINER_APP_NAME: $(DAVI_AZURE_CONTAINER_APP_NAME)

                # 인증 없는 health의 고정 상태만 본다. 응답 본문과 비밀값은 로그에 출력하지 않는다.
                - task: AzureCLI@2
                  displayName: HTTPS health 스모크
                  inputs:
                    azureSubscription: $(DAVI_AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: false
                    inlineScript: |
                      set -euo pipefail
                      az containerapp show \
                        --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
                        --name "$DAVI_AZURE_CONTAINER_APP_NAME" \
                        --query 'properties.configuration.ingress.fqdn' \
                        --output tsv > /tmp/davi-container-app-fqdn
                      read -r fqdn < /tmp/davi-container-app-fqdn
                      test -n "$fqdn"

                      for attempt in $(seq 1 18); do
                        if curl --fail --silent --show-error --max-time 10 \
                          --output /tmp/davi-health-response \
                          "https://$fqdn/health" \
                          && jq -e \
                            '.status == "ok" and .environment == "development" and .stub_llm == false' \
                            /tmp/davi-health-response >/dev/null; then
                          printf 'shared development URL: https://%s\n' "$fqdn"
                          exit 0
                        fi
                        sleep 10
                      done
                      echo '##vso[task.logissue type=error]Container App health 확인에 실패했습니다.'
                      exit 1
                  env:
                    DAVI_AZURE_RESOURCE_GROUP: $(DAVI_AZURE_RESOURCE_GROUP)
                    DAVI_AZURE_CONTAINER_APP_NAME: $(DAVI_AZURE_CONTAINER_APP_NAME)
