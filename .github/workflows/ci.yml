name: CI

# PR과 main 푸시에서 실행한다. PR은 바뀐 스택을 전부 검사하고, main 푸시는 저장소 전역
# 검사와 Android만 돌린다(#363). 서버·인프라 런타임은 해당 경로에서 함께 도는 Azure
# development deploy가 image 빌드와 /health로 확인한다. pytest/ruff, eval 검사, 앱 계약 파일의
# 서버 드리프트 검사는 병합 후 다시 돌지 않는다는 공백을 감수한 비용 절감 결정이다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다(러너 낭비 방지).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 어느 스택이 바뀌었는지 판정하고, 스택에 매이지 않는 저장소 전역 검사를 함께 돌린다.
  # GitHub은 잡 단위 paths 필터를 지원하지 않아 판정은 이 잡이 대신한다.
  #
  # **전역 검사가 여기 있는 이유는 둘이다.**
  # ① 원래 Android 잡에 있었는데 그 잡은 android 경로 필터로 돌아서, 저장소 다른 폴더의
  #    .ps1/.sh만 바뀐 PR에서는 검사가 통째로 건너뛰어졌다(옛 주석이 그 갭을 적고 있었다).
  # ② GitHub은 **잡마다** 실행 시간을 1분 단위로 올려 청구한다. 이 잡은 평균 7초를 쓰고
  #    1분을 내고 있었으므로 몇 초짜리 검사를 여기 얹는 추가 비용이 0이다. 반대로 전용 잡을
  #    새로 떼면 그것만으로 매 실행 1분이 는다.
  changes:
    name: 변경 감지 + 저장소 전역 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      # v4가 필요하다. 아래 android 필터의 `!` 제외 패턴은 predicate-quantifier
      # 'some-with-excludes'에서만 동작하고, 그 값은 **v4.0.3**에 들어왔다(v4.0.2 이하에
      # 핀하면 입력이 거부된다 — action.yml로 확인했다). v3에서도 `!` 패턴 자체는 파싱되지만,
      # 기본 quantifier `some` 아래서는 파일이 `app-android/**` 하나만 맞아도 포함돼
      # 제외가 무력화된다.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # 파일이 패턴 하나 이상에 걸리고 `!` 패턴에는 하나도 안 걸릴 때만 포함한다.
          # 제외는 최종적이라 다른 패턴으로 되돌려 넣을 수 없다.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            android:
              - 'app-android/**'
              - '.github/workflows/ci.yml'
              # 빌드 입력도 검사 입력도 아닌 것은 뺀다. 문서 한 줄 고친 PR이 5분짜리
              # Android 잡을 부르지 않게 하려는 것이다. 여기 있는 것들이 바뀌어도 APK와
              # 검사 결과는 바이트로 같다 — 시나리오 정의(device-e2e-scenarios.json)와
              # scripts/ 는 렌더러 테스트가 실제로 읽으므로 빼지 않는다.
              # `**/*.md`가 아니라 최상위만이다. 추적 중인 .md 7개가 전부 app-android/ 바로
              # 아래이고, 하위 트리를 통째로 빼면 나중에 assets/*.md 같은 **빌드 입력**이
              # 생겼을 때 그것만 바꾼 PR에서 Android 잡이 조용히 건너뛰어진다.
              - '!app-android/*.md'
              - '!app-android/.gitignore'
              - '!app-android/licenses/**'
            backend:
              - 'server/**'
              - 'eval/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/eval-judge.yml'
              # 앱의 계약 파일이 바뀌어도 백엔드 잡을 돌린다.
              # test_contract_drift.py 가 이 파일을 읽어 서버 enum과 대조하기 때문이다.
              # 이게 없으면 앱만 고친 PR에서 드리프트 검사가 통째로 건너뛰어진다.
              - 'app-android/app/src/main/java/com/davi/helper/Contract.kt'
              - 'app-android/app/src/main/java/com/davi/helper/RequestTracing.kt'
            infrastructure:
              - 'server/Dockerfile'
              - 'server/.dockerignore'
              - 'server/requirements.txt'
              - 'server/requirements.lock.txt'
              - 'server/app/**'
              - 'infra/azure/**'
              - '.github/workflows/azure-dev-deploy.yml'
              - '.github/workflows/ci.yml'

      - name: 실기기 결과 문서 렌더러 테스트
        working-directory: app-android
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          ./scripts/run-device-e2e.sh --list-scenarios

      - name: Windows PowerShell 실행기 구문·registry 테스트
        working-directory: app-android
        shell: pwsh
        run: ./scripts/run-device-e2e.ps1 -ListScenarios

      # .ps1은 BOM이 필수다. Windows PowerShell 5.1은 BOM이 없으면 한글 주석을 CP949로 읽어,
      # 구문이 멀쩡한데도 엉뚱한 줄에서 "Unexpected token '}'" 류로 죽는다.
      # .sh는 정반대로 BOM이 있으면 안 된다. `#!/usr/bin/env bash` 셔뱅이 깨져 실행되지 않는다.
      # 이 잡은 pwsh(7)로 돌아 두 문제 모두 재현하지 못하므로 바이트로 직접 확인한다.
      # 이 검사가 Android 잡이 아니라 여기 있는 것은 저장소 어느 폴더의 .ps1/.sh가 바뀌어도
      # 돌아야 하기 때문이다. android 경로 필터에 매여 있던 동안은 scripts/만 바뀐 PR에서
      # 통째로 건너뛰어졌다.
      - name: 셸 스크립트 인코딩 검사 (.ps1 BOM 필수 / .sh BOM 금지)
        shell: pwsh
        run: |
          function Test-Bom([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            return ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
          }
          # **대상 목록은 git에서 받는다.** 원래 `Get-ChildItem -Recurse`였는데 둘을 틀렸다.
          # ① pwsh는 Unix에서 점으로 시작하는 항목을 hidden으로 취급해 `-Force` 없이는 빼먹는다.
          #    러너가 리눅스라 `.claude/hooks/`의 .ps1 셋이 통째로 스캔에서 빠져 있었다 —
          #    추적 중인 .ps1은 6개인데 CI 로그는 "3개"를 찍고 있었다. 하필 그 셋이 한글 주석이
          #    든 Windows PowerShell 5.1 대상 훅이라 이 규칙의 정면 대상이다. 개발 PC(Windows)
          #    에서는 점 폴더가 hidden이 아니라 로컬로 돌리면 멀쩡히 통과해 보인다.
          # ② .git·빌드 산출물처럼 우리가 쓰지 않은 파일까지 잡는다.
          $ps1 = @(git ls-files '*.ps1')
          $sh = @(git ls-files '*.sh')
          # **빈 목록을 통과로 읽지 않는다.** 목록이 비면 아래 검사가 통째로 공회전해 초록이 된다.
          # git이 죽거나 glob이 낡으면 정확히 그 모양이 된다.
          if ($ps1.Count -eq 0 -or $sh.Count -eq 0) {
            throw "빈 관문: 검사 대상을 못 찾았다 (.ps1 $($ps1.Count)개 / .sh $($sh.Count)개)."
          }
          $bad = @()
          $bad += @($ps1 | Where-Object { -not (Test-Bom $_) } |
            ForEach-Object { "BOM 없음 (.ps1은 필수): $_" })
          $bad += @($sh | Where-Object { Test-Bom $_ } |
            ForEach-Object { "BOM 있음 (.sh는 금지 — 셔뱅이 깨진다): $_" })
          if ($bad) {
            $bad
            throw '셸 스크립트 인코딩 규칙 위반.'
          }
          ".ps1 $($ps1.Count)개(BOM 필수) / .sh $($sh.Count)개(BOM 금지) — 통과"

      # 앱 1차와 서버 2차는 같은 규칙을 두 언어로 든다. 앱은 본문을 그대로 두고 컴파일할 때만
      # 유니코드 플래그를 얹는데(자바의 `\d`·`\s`가 기본 ASCII라서다, #361), **그 구조는 본문이 갈리지
      # 않아야 성립한다.** 지금까지 그걸 지키는 건 사람 눈과 양쪽에 손으로 맞춘 테스트뿐이었다.
      #
      # **경로 필터가 걸리는 잡에 두지 않는다.** 이 검사는 앱·서버 어디에도 속하지 않아서,
      # 한쪽만 바뀐 PR에서 안 도는 관문이 되면 없는 것과 같다. 항상 도는 이 잡이 맞는 자리다.
      - name: 앱·서버 마스킹 정규식 본문 대조
        run: python3 .github/scripts/check_masking_parity.py

  android:
    name: Android (debug/release APK + test)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      # wrapper jar는 바이너리다. 알려진 공식 배포본과 체크섬이 맞는지 먼저 검증한다.
      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v4

      # gradle/gradle-daemon-jvm.properties가 데몬 JVM을 Java 21로 고정한다.
      # 런처도 21로 맞춰 불필요한 JDK 재프로비저닝을 줄인다.
      # (vendor가 JETBRAINS라 데몬용 JDK는 Gradle이 foojay에서 따로 받아온다.)
      - name: JDK 21 셋업
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK 경로(ANDROID_HOME)와 라이선스 동의를 준비한다.
      # compileSdk 36 플랫폼은 AGP가 필요 시 자동 다운로드한다.
      - name: Android SDK 셋업
        uses: android-actions/setup-android@v3

      # 버전을 지정하지 않으면 wrapper(gradle-wrapper.properties)의 Gradle을 쓴다.
      # 캐시(~/.gradle)도 이 액션이 관리한다.
      - name: Gradle 셋업
        uses: gradle/actions/setup-gradle@v4

      # 실기기/Gemini 시나리오는 opt-in이다. 여기서는 제품 APK와 e2e-driver test APK, 단위 테스트를
      # 먼저 만들고, :app의 androidTest는 아래 별도 스텝에서 비용을 드러내며 컴파일한다(#385).
      # assembleRelease는 preReleaseBuild를 거쳐 verifyReleaseConfiguration을 문다(#248) —
      # DAVI_RELEASE_ACCESS_TOKEN이 없으면 여기서 항상 실패하므로 CI 전용 더미값을 준다.
      - name: debug/release/e2e test APK 빌드 + 단위 테스트
        env:
          DAVI_RELEASE_ACCESS_TOKEN: ci-only-not-a-secret-release-token-0001
        run: ./gradlew :app:assembleDebug :e2e-driver:assembleDebugAndroidTest :app:assembleRelease test

      # 리소스 id가 삭제됐는데 app/src/androidTest가 옛 R.id를 계속 참조한 회귀를 컴파일에서 잡는다.
      # connectedDebugAndroidTest는 일반 CI에서 돌리지 않는다 — 현재 계측 테스트에는 삼성 카메라
      # package를 전제로 한 항목이 있어 범용 에뮬레이터 관문이 아니며, 실기기 동작 검증은 위 opt-in
      # E2E 경계를 유지한다. 별도 스텝인 이유는 추가 비용을 Actions UI에서 초 단위로 읽기 위해서다.
      - name: 앱 계측 테스트 APK 컴파일
        run: ./gradlew :app:assembleDebugAndroidTest

      # debug/release 산출물의 제품 경계를 산출물에서 직접 확인한다(#58). build.gradle.kts를
      # 읽어 확인하면 "설정이 있다"만 보이고 **패키징까지 실제로 갔는지**는 못 본다 —
      # 이 경계가 깨진 채 나간 빌드가 기기에서 서로를 밀어냈기 때문에 산출물로 고정한다.
      - name: debug/release 앱 식별자·이름 경계 확인
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)"
          test -n "$aapt2"

          # **파이프의 종료 코드에도 기대지 않는다.** `badging "$1" | grep -q` 는 종료 코드가
          # grep의 것이라 aapt2가 실패해도 "패턴 없음"으로 읽혀 경계가 조용히 통과한다.
          # 덤프를 파일로 떠 두고 실패·빈 출력을 그 자리에서 죽인다(PR #354 리뷰).
          badging_to() {  # $1=apk $2=출력파일
            "$aapt2" dump badging "$1" > "$2" || { echo "badging 실패: $1" >&2; exit 1; }
            test -s "$2" || { echo "badging 출력이 비었다: $1" >&2; exit 1; }
          }
          # 키를 오타내도 조용히 다른 값을 돌려주지 않게 갈래를 닫는다.
          meta() {
            case "$2" in
              applicationId) python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['applicationId'])" "$1" ;;
              outputFile)    python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['elements'][0]['outputFile'])" "$1" ;;
              *) echo "meta: 알 수 없는 키 $2" >&2; exit 1 ;;
            esac
          }
          appid() { meta "$1" applicationId; }

          # **`!` + `set -e`에 기대지 않는다.** bash는 `!`로 부정된 명령에 errexit를 적용하지
          # 않아(`set -e` 문서), `! cmd | grep -q PAT` 는 위반을 만나도 스텝을 죽이지 못한다.
          # 스크립트의 **마지막 명령일 때만** 종료 코드가 스텝 결과가 되어 우연히 동작한다 —
          # 그 밑에 한 줄만 덧붙이면 경계가 조용히 검사를 멈춘다(PR #281 리뷰에서 실측).
          # 각 검사를 스스로 exit 하는 게이트로 만들고, 어느 경계가 깨졌는지도 함께 찍는다.
          #
          # **같은 모양의 게이트를 쓰는 자리가 셋이다.** 입력을 뜨는 방법이 서로 달라
          # (aapt2 dump badging / 생성된 XML / dex strings) 헬퍼를 공유하지 않고 각자 두는 대신,
          # 게이트의 모양·이름·이 근거 주석을 셋에 맞춘다 — 하나만 고치면 나머지가 같은 결함으로
          # 되돌아간다(PR #354 리뷰 2번이 실제 사례다).
          #   ① 「debug/release 앱 식별자·이름 경계 확인」
          #   ② 「debug Azure HTTPS endpoint 허용」 — 네트워크 보안 config
          #   ③ 「release 산출물에 debug 전용 흔적이 없는지 확인」
          #
          # **방향은 인자가 아니라 이름에 박는다.** apk를 인자로 받으면 호출을 반대로 바꿔도
          # 조용하고, 메시지가 엉뚱한 산출물을 가리킨다. 이 스텝은 apk가 딱 둘이라 이 편이 짧다.
          assert_absent_in_release() {  # $1=패턴 $2=설명
            if grep -qE "$1" "$release_badging"; then
              echo "release 경계 위반: $2 ($1)" >&2
              exit 1
            fi
          }
          assert_present_in_debug() {  # $1=패턴 $2=설명
            if ! grep -qE "$1" "$debug_badging"; then
              echo "빈 관문: $2 ($1)" >&2
              exit 1
            fi
          }
          # **파일명을 박지 않는다.** 서명 키가 없는 환경(CI·키 없는 팀원 PC)의 release 산출물은
          # app-release-unsigned.apk가 되어 이름이 달라진다. AGP가 실제 이름을 여기 적어 준다.
          # `echo "$(…)"` 는 치환이 죽어도 echo가 0을 돌려준다 — `meta`의 exit 1도 `$( )` 안이라
          # 서브셸만 죽인다. 아래 `test -f`가 받긴 하지만 화면에는 트레이스백만 남아
          # "메타데이터를 못 읽었다"가 "APK가 없다"로 읽힌다(PR #354 리뷰).
          apk_of() {  # $1=output-metadata.json
            local name
            name="$(meta "$1" outputFile)" \
              || { echo "산출물 메타데이터를 읽지 못했다: $1" >&2; exit 1; }
            echo "$(dirname "$1")/$name"
          }

          debug_meta=app/build/outputs/apk/debug/output-metadata.json
          release_meta=app/build/outputs/apk/release/output-metadata.json
          debug_apk="$(apk_of "$debug_meta")"
          release_apk="$(apk_of "$release_meta")"
          echo "debug=$debug_apk  release=$release_apk"
          test -f "$debug_apk" && test -f "$release_apk"
          debug_badging="$(mktemp)"
          release_badging="$(mktemp)"
          badging_to "$debug_apk" "$debug_badging"
          badging_to "$release_apk" "$release_badging"

          # 앱 식별자 — 함께 설치되려면 서로 달라야 한다.
          test "$(appid "$debug_meta")" = com.davi.helper.debug
          test "$(appid "$release_meta")" = com.davi.helper

          # 앱 이름 — release는 제품 이름을 유지하고, debug 이름이 새어 들어가면 안 된다.
          debug_label="$(sed -n "s/^application-label:'\(.*\)'$/\1/p" "$debug_badging")"
          release_label="$(sed -n "s/^application-label:'\(.*\)'$/\1/p" "$release_badging")"
          test "$debug_label" = '다비 (개발)'
          test "$release_label" = '다비'

          # release 산출물에 debug 식별자·이름이 없다는 것을 반대 방향으로도 못박는다.
          assert_absent_in_release 'com\.davi\.helper\.debug' 'debug 식별자가 release에 실렸다'
          assert_absent_in_release '개발' 'debug 앱 이름이 release에 실렸다'

          # versionName 접미어도 같은 경계다 — 스토어에 -debug가 붙어 나가면 안 된다.
          # release 쪽도 접미어의 유무로만 좁힌다. `debug` 통짜로 보면 badging 출력 어디에
          # 그 글자가 스쳐도 이 경계와 무관한 이유로 빨개진다.
          assert_present_in_debug "versionName='[^']*-debug'" 'debug versionName에서 -debug 접미어가 사라졌다'
          assert_absent_in_release "versionName='[^']*-debug'" 'release versionName에 -debug가 붙었다'

      - name: debug 평문 허용 host 제한
        env:
          DAVI_DEBUG_SERVER_URL: http://192.168.1.2:8000
          DAVI_DEBUG_ACCESS_TOKEN: ci-only-not-a-secret-token-value-0001
        run: |
          ./gradlew generateDebugNetworkSecurityConfig
          config="app/build/generated/res/network-security/debug/xml/network_security_config.xml"
          # **여기에 검사를 더한다면 `! grep -q` 로 적지 말 것.** 부정된 명령은 errexit를 타지
          # 않아 조용히 통과한다(#293). 아래 세 줄은 부정도 파이프도 없는 맨 grep이라 지금은
          # errexit가 살아 있고, 파일이 없으면 grep이 2로 죽어 스텝이 빨개진다 — 그래서 PR #354
          # 배치에서 게이트로 바꾸지 않았다(헬퍼를 네 번째로 복제할 값이 없다). 검사를 늘릴
          # 때는 형제 스텝 「debug Azure HTTPS endpoint 허용」의 게이트 모양을 그대로 가져온다.
          grep -q '<base-config cleartextTrafficPermitted="false"' "$config"
          grep -q '<domain includeSubdomains="false">192.168.1.2</domain>' "$config"
          test "$(grep -c 'cleartextTrafficPermitted="true"' "$config")" -eq 1

      - name: debug Azure HTTPS endpoint 허용
        env:
          DAVI_DEBUG_SERVER_URL: https://davi-server-dev.example.azurecontainerapps.io
          DAVI_DEBUG_ACCESS_TOKEN: ci-only-not-a-secret-token-value-0001
        run: |
          # 이 스텝의 검증 대상은 아래 생성 XML 하나다. Azure HTTPS URL로 APK 전체 빌드가
          # 끝까지 간다는 확인은 비용 대비 포기하고 생성 태스크만 실행한다(#363). 생성 res가
          # APK에 배선되는 경계는 앞의 기본 debug assemble이 계속 확인한다. 그 결과 뒤의
          # 화면 상세 로그 카나리아도 이 스텝이 다른 URL로 덮어쓴 APK가 아니라 앞 빌드 스텝의
          # 산출물을 보게 된다. 형제 스텝 「debug 평문 허용 host 제한」과도 같은 경계다.
          ./gradlew generateDebugNetworkSecurityConfig
          config="app/build/generated/res/network-security/debug/xml/network_security_config.xml"
          # `!`로 부정된 명령은 errexit를 타지 않아 **마지막 줄만** 스텝 결과가 됐다. 그래서
          # 평문 트래픽 허용(`cleartextTrafficPermitted="true"`)이 새어도 이 스텝은 초록이었다 —
          # 산출물 검사에서 같은 결함을 고친 PR #281·#354와 같은 모양의 게이트로 바꾼다.
          # **파일이 없을 때도 닫는다.** grep은 파일이 없으면 2로 죽는데, 부정 검사에서는
          # 그게 "패턴 없음"으로 읽혀 또 하나의 빈 관문이 된다.
          #
          # **같은 모양의 게이트를 쓰는 자리가 셋이다.** 입력을 뜨는 방법이 서로 달라
          # (aapt2 dump badging / 생성된 XML / dex strings) 헬퍼를 공유하지 않고 각자 두는 대신,
          # 게이트의 모양·이름·이 근거 주석을 셋에 맞춘다 — 하나만 고치면 나머지가 같은 결함으로
          # 되돌아간다(PR #354 리뷰 2번이 실제 사례다).
          #   ① 「debug/release 앱 식별자·이름 경계 확인」
          #   ② 「debug Azure HTTPS endpoint 허용」 — 네트워크 보안 config
          #   ③ 「release 산출물에 debug 전용 흔적이 없는지 확인」
          test -f "$config"
          # **두 방향의 접두어를 나눈다.** 긍정 검사가 깨지는 것은 보안 사고가 아니라 **검사
          # 문자열이 낡은 것**(AGP 출력 형태 변경)이다. 같은 접두어로 찍으면 받는 사람이 평문이
          # 실제로 샌 줄 알고 산출물을 뒤진다(PR #354 리뷰).
          assert_present_in_config() {  # $1=패턴 $2=설명
            if ! grep -q "$1" "$config"; then
              echo "빈 관문: $2 ($1)" >&2
              exit 1
            fi
          }
          assert_absent_in_config() {  # $1=패턴 $2=설명
            if grep -q "$1" "$config"; then
              echo "debug 네트워크 보안 경계 위반: $2 ($1)" >&2
              exit 1
            fi
          }
          # **순서가 메시지를 정한다 — 누출이 먼저 이름을 얻어야 한다.** 셋 다 자체 종료
          # 게이트라 어느 것이 먼저 걸리든 스텝은 죽고, 순서는 *어느 메시지를 보여줄지*만
          # 정한다. 빈 관문 검사를 앞에 두면 base-config가 통째로 `true`가 된 정책 회귀가
          # `빈 관문: … 검사 문자열이 낡았다`로 찍혀, 받는 사람이 사고 대신 AGP 출력을 뒤진다
          # (PR #354 리뷰). ①·③은 두 방향이 서로 다른 산출물을 봐서 이 문제가 없다 —
          # 한 파일을 두 방향으로 보는 건 여기뿐이다. 정리한다고 되돌리지 말 것.
          assert_absent_in_config 'cleartextTrafficPermitted="true"' '평문 트래픽 허용이 HTTPS 전용 설정에 새어 들어갔다'
          assert_absent_in_config '<domain-config' 'HTTPS endpoint인데 domain-config 예외가 생겼다'
          assert_present_in_config '<base-config cleartextTrafficPermitted="false"' '기본 평문 트래픽 차단 검사 문자열이 낡았다'

      - name: debug 임의 HTTPS endpoint 거부
        env:
          DAVI_DEBUG_SERVER_URL: https://not-davi.example.com
          DAVI_DEBUG_ACCESS_TOKEN: ci-only-not-a-secret-token-value-0001
        run: |
          set +e
          output="$(./gradlew generateDebugNetworkSecurityConfig 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "Azure Container Apps 기본 endpoint" <<<"$output"

      - name: release에서 development 설정 거부
        env:
          DAVI_DEBUG_SERVER_URL: http://192.168.1.2:8000
          DAVI_DEBUG_ACCESS_TOKEN: ci-only-not-a-secret-token-value-0001
        run: |
          set +e
          output="$(./gradlew verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "release 빌드 전에" <<<"$output"

      # 서버가 development 프로필이라 release도 접근 토큰을 요구한다(#248). 세 경계를 각각 고정한다
      # — 미설정, 32자 미만, 정상값(통과 + BuildConfig 배선).
      - name: release 접근 토큰 미설정 거부
        run: |
          set +e
          output="$(./gradlew verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "DAVI_RELEASE_ACCESS_TOKEN을 설정하세요" <<<"$output"

      - name: release 접근 토큰 32자 미만 거부
        env:
          DAVI_RELEASE_ACCESS_TOKEN: ci-only-short-token-0001
        run: |
          set +e
          output="$(./gradlew verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "DAVI_RELEASE_ACCESS_TOKEN은 32자 이상이어야 합니다" <<<"$output"

      - name: release 접근 토큰 정상값 통과 및 BuildConfig 배선 확인
        env:
          DAVI_RELEASE_ACCESS_TOKEN: ci-only-not-a-secret-release-token-0001
        run: |
          ./gradlew verifyReleaseConfiguration
          ./gradlew :app:generateReleaseBuildConfig
          generated="app/build/generated/source/buildConfig/release/com/davi/helper/BuildConfig.java"
          test -f "$generated"
          grep -q 'DEV_ACCESS_TOKEN = "ci-only-not-a-secret-release-token-0001"' "$generated"

      # 마스킹 우회는 debug 전용이다(#203). release 경로에서는 값이 false여도 "설정이 있다는 것"
      # 자체를 실패로 본다 — 의도를 오인한 실행이기 때문이다. 두 입력 경로를 각각 확인한다.
      - name: release에서 마스킹 우회 속성 거부
        run: |
          set +e
          output="$(./gradlew -PdaviDisablePrivacyMasking=false verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "daviDisablePrivacyMasking" <<<"$output"

      - name: release에서 마스킹 우회 환경변수 설정 거부
        env:
          DAVI_DISABLE_PRIVACY_MASKING: 'false'
        run: |
          set +e
          output="$(./gradlew verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "DAVI_DISABLE_PRIVACY_MASKING" <<<"$output"

      # 위 관문이 release + 우회 속성 조합 자체를 막으므로, 여기서는 정상 release 산출물의
      # 상수가 false인지 본다. debug 값이 defaultConfig로 새는 배선 실수를 잡는 자리다.
      # generateReleaseBuildConfig도 preReleaseBuild를 거쳐 verifyReleaseConfiguration을
      # 물기 때문에(#248) 토큰이 없으면 이 단계도 실패한다.
      - name: release BuildConfig의 마스킹 상수 고정 확인
        env:
          DAVI_RELEASE_ACCESS_TOKEN: ci-only-not-a-secret-release-token-0001
        run: |
          ./gradlew :app:generateReleaseBuildConfig
          generated="app/build/generated/source/buildConfig/release/com/davi/helper/BuildConfig.java"
          test -f "$generated"
          grep -q 'PRIVACY_MASKING_DISABLED = false' "$generated"

      # 이 스텝은 **debug 전용 흔적 둘**을 산출물에서 본다 — 화면 상세 로그(#58)와
      # 목표 주입 진입점의 extra 키(#323)다. 둘 다 "문자열이 산출물에 없으면 그 기능은
      # 절대 동작할 수 없다"는 같은 논리로 지킨다.
      #
      # 화면 요소의 label·bounds 상세 로그는 debug 전용이다(#58). 마스킹은 패턴 기반이라
      # 사람 이름·대화 내용처럼 패턴 밖 텍스트를 지우지 못하므로 "마스킹했으니 남겨도 된다"가
      # 성립하지 않는다. **포맷 문자열이 산출물에 없으면 그 줄은 절대 나올 수 없다** —
      # 소스를 읽는 정적 검사보다 이 편이 우회하기 어렵다.
      #
      # debug 쪽도 함께 본다. release만 검사하면 포맷이 바뀌었을 때 검사가 조용히 통과하는
      # 빈 관문이 된다 — 카나리아가 사라진 걸 실패로 잡아야 검사가 살아 있다.
      - name: release 산출물에 debug 전용 흔적이 없는지 확인
        run: |
          # **덤프는 한 번만 뜨고 파일로 둔다.** `unzip -p … | strings` 는 파이프의 종료 코드가
          # strings의 것이라 **unzip이 실패해도 0**이다. dex 이름·경로가 어긋나면 빈 문자열에서
          # grep 하게 되어 검사가 조용히 통과한다 — 이 스텝이 닫으려는 것과 같은 종류의 빈 관문이
          # release 쪽에 그대로 남는다. `set -o pipefail`만으로는 안 고쳐진다: 실패가 `if` 조건
          # 안이면 errexit를 타지 않고 그냥 "패턴 없음"으로 읽힌다(PR #354 리뷰에서 위조 입력으로
          # 양쪽 확인). 그래서 덤프 자체의 실패·빈 결과를 그 자리에서 죽인다.
          # 덤으로 카나리아마다 2회씩 총 6회 돌던 전체 dex strings가 2회로 준다.
          set -o pipefail
          dump_to() {  # $1=apk $2=출력파일
            unzip -p "$1" 'classes*.dex' | strings > "$2" \
              || { echo "덤프 실패: $1 에서 classes*.dex를 읽지 못했다" >&2; exit 1; }
            test -s "$2" || { echo "덤프가 비었다: $1" >&2; exit 1; }
          }
          # **파일명을 박지 않는다.** 서명 키가 없는 환경(CI·키 없는 팀원 PC)의 release
          # 산출물은 app-release-unsigned.apk가 되어 이름이 달라진다. AGP가 output-metadata.json에
          # 실제 이름을 적어 주므로 거기서 유도한다.
          # `echo "$(…)"` 는 치환이 죽어도 echo가 0을 돌려준다. 아래 `test -f`가 받긴 하지만
          # 화면에는 트레이스백만 남아 "메타데이터를 못 읽었다"가 "APK가 없다"로 읽힌다
          # (PR #354 리뷰). 이 배치의 나머지 자리와 같은 모양으로 그 자리에서 죽인다.
          apk_of() {  # $1=output-metadata.json
            local name
            name="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['elements'][0]['outputFile'])" "$1")" \
              || { echo "산출물 메타데이터를 읽지 못했다: $1" >&2; exit 1; }
            echo "$(dirname "$1")/$name"
          }
          debug_apk="$(apk_of app/build/outputs/apk/debug/output-metadata.json)"
          release_apk="$(apk_of app/build/outputs/apk/release/output-metadata.json)"
          echo "debug=$debug_apk  release=$release_apk"
          test -f "$debug_apk" && test -f "$release_apk"
          debug_dump="$(mktemp)"
          release_dump="$(mktemp)"
          dump_to "$debug_apk" "$debug_dump"
          dump_to "$release_apk" "$release_dump"

          # GuideScreenLog의 debug 구현만 쓰는 포맷이다. 바꾸면 이 목록도 함께 고친다.
          #
          # `at=`는 **highlight 좌표 전용**이다. 앞의 둘은 요소 덤프 경로 소속이라, highlight가
          # 좌표를 다시 찍어도 그 둘은 생기지 않아 검사가 통과해 버린다(PR #287 리뷰).
          # 요소 덤프의 `bounds=`를 카나리아로 쓸 수 없는 이유는 UiElement의 자동 생성
          # toString(`..., bounds=...`)이 release 산출물에도 남아 구분이 안 되기 때문이다.
          # **`!` + `set -e`에 기대지 않는다.** bash는 `!`로 부정된 명령에 errexit를 적용하지
          # 않으므로(`set -e` 문서), `! dump | grep -qF` 는 위반을 만나도 루프를 죽이지 못하고
          # **마지막 반복의 종료 코드만** 스텝 결과가 된다. 그래서 제일 중요한 첫 카나리아
          # (`label='` — release logcat에 화면 label 원문이 남지 않는다)의 위반이 통째로
          # 지나갔다(#293). 같은 결함을 「debug/release 앱 식별자·이름 경계 확인」 스텝이
          # assert_absent로 고쳤다(PR #281 리뷰).
          #
          # **같은 모양의 게이트를 쓰는 자리가 셋이다.** 입력을 뜨는 방법이 서로 달라
          # (aapt2 dump badging / 생성된 XML / dex strings) 헬퍼를 공유하지 않고 각자 두는 대신,
          # 게이트의 모양·이름·이 근거 주석을 셋에 맞춘다 — 하나만 고치면 나머지가 같은 결함으로
          # 되돌아간다(PR #354 리뷰 2번이 실제 사례다).
          #   ① 「debug/release 앱 식별자·이름 경계 확인」
          #   ② 「debug Azure HTTPS endpoint 허용」 — 네트워크 보안 config
          #   ③ 「release 산출물에 debug 전용 흔적이 없는지 확인」
          #
          # **방향은 인자가 아니라 이름에 박는다.** 덤프를 인자로 받으면 호출을 반대로 바꿔도
          # 조용하고, 메시지가 엉뚱한 산출물을 가리킨다. 산출물이 딱 둘이라 이 편이 짧다.
          # **설명을 인자로 받는다.** 이 스텝이 지키는 경계가 둘이 되면서(화면 상세 로그 ·
          # debug 전용 진입점) 메시지를 한 문장으로 박아 두면 엉뚱한 경계를 가리킨다.
          # ①「debug/release 앱 식별자·이름 경계 확인」이 이미 같은 두 인자 모양이다.
          assert_present_in_debug() {  # $1=카나리아 $2=무엇을 지키는가
            if ! grep -qF "$1" "$debug_dump"; then
              echo "빈 관문: $2 — 카나리아 [$1]가 debug 산출물에 없다" >&2
              exit 1
            fi
          }
          assert_absent_in_release() {  # $1=카나리아 $2=무엇을 지키는가
            if grep -qF "$1" "$release_dump"; then
              echo "release 경계 위반: $2 — 카나리아 [$1]가 release 산출물에 있다" >&2
              exit 1
            fi
          }
          for canary in "label='" " scroll=" " at="; do
            assert_present_in_debug "$canary" 'debug 상세 로그 포맷이 사라졌다'
            assert_absent_in_release "$canary" '화면 상세 로그가 release에 실렸다'
          done

          # 목표를 인텐트로 넣는 debug 전용 진입점(#323)도 같은 게이트로 본다. 클래스가 debug
          # 소스셋에만 있어 구조적으로도 안 들어가지만, 그 전제가 깨지는 것을 산출물에서 직접
          # 잡는다 — 이 키가 release에 있으면 아무 앱이나 목표를 밀어 넣을 수 있다.
          # **방향마다 목록이 다르다.** "davi.goal"은 "davi.goal.b64"의 부분 문자열이라,
          # 한 목록을 두 방향에 그대로 쓰면 한쪽이 죽은 게이트가 된다:
          #   · absent 방향 — "davi.goal"이 b64 키까지 덮으므로 b64를 따로 볼 필요가 없다
          #   · present 방향 — "davi.goal"이 b64 키에 걸려 **원문 키가 통째로 사라져도 통과**한다
          # 그래서 원문 키의 present는 **출현 횟수로** 본다. 완전일치(`grep -xF`)를 먼저 썼다가
          # CI에서 빨개졌다 — dex strings 출력은 상수가 한 줄로 떨어진다는 보장이 없다(로컬
          # 흉내로는 통과했고 실제 `strings`에서 실패했다, PR #364). 모든 "davi.goal.b64"는
          # "davi.goal"을 포함하므로, 원문 키가 살아 있으면 전자보다 후자가 반드시 더 많다.
          # **한계**: 원문 키를 다른 이름으로 개명하면(davi.goal.raw 따위) 이 검사는 통과한다.
          # 키가 사라지는 것만 잡는다 — 개명은 이 파일을 함께 고치는 사람이 본다.
          for canary in "davi.goal.b64" "davi.autostart"; do
            assert_present_in_debug "$canary" 'debug 목표 주입 진입점이 사라졌다'
          done
          # **`grep -c`가 아니라 `grep -o | wc -l`이다.** -c는 매칭된 **줄 수**를 세는데 둘이
          # 같은 줄에 있으면 나란히 1이 되어 이 검사가 통째로 죽는다(실측).
          raw_hits="$(grep -oF "davi.goal" "$debug_dump" | wc -l)"
          b64_hits="$(grep -oF "davi.goal.b64" "$debug_dump" | wc -l)"
          if [ "$raw_hits" -le "$b64_hits" ]; then
            echo "빈 관문: debug 목표 주입의 원문 키가 사라졌다 — davi.goal($raw_hits) <= davi.goal.b64($b64_hits)" >&2
            exit 1
          fi
          for canary in "davi.goal" "davi.autostart"; do
            assert_absent_in_release "$canary" 'debug 목표 주입 진입점이 release에 실렸다'
          done

  # 서버 스택 검사를 PR에서만 한 잡에 모은다. PR CI는 PR 브랜치를 main에 합쳐 본 merge ref를
  # 검사한다. main이 나중에 움직여도 그 ref가 자동 갱신되지는 않지만, 무료 private 플랜이라
  # 최신화 강제도 할 수 없다. main 푸시에서 이 잡을 다시 돌리던 안전망은 비용 대비 포기한다
  # (#363). server/·infra/azure/ 변경의 런타임은 Azure development deploy의 image 빌드와
  # /health가 별도로 확인하지만, pytest/ruff는 다시 돌지 않는다. eval만 바뀐 main 푸시와 앱
  # 계약 파일만 바뀐 main 푸시는 deploy 대상도 아니므로 eval 검사·서버 계약 드리프트 검사의
  # 대체 안전망이 아예 없다는 공백도 의도적으로 감수한다.
  #
  # Backend와 Infrastructure를 나누어 두었을 땐 각각 20초·33초를 쓰고도 **1분씩**
  # 냈다 — GitHub은 잡마다 실행 시간을 1분 단위로 올려 청구하기 때문이다. 합치면 둘 다
  # 도는 실행의 청구가 2분에서 1분이 된다(표본 36건 중 34건이 합계 60초 미만).
  # 스텝별 `if`로 실제로 바뀐 쪽만 돌리는 것은 나뉘어 있을 때와 같다.
  backend:
    name: Backend (ruff + pytest + Docker + Bicep)
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.infrastructure == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 셋업
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: 의존성 설치
        if: needs.changes.outputs.backend == 'true'
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # SPEC §5: 타입체커는 두지 않는다. 필요해지면 mypy를 추가하고 SPEC도 같이 고칠 것.
      - name: 린트
        if: needs.changes.outputs.backend == 'true'
        working-directory: server
        run: ruff check .

      - name: 포맷 검사
        if: needs.changes.outputs.backend == 'true'
        working-directory: server
        run: ruff format --check .

      - name: 테스트
        if: needs.changes.outputs.backend == 'true'
        working-directory: server
        run: pytest

      # #30의 음성 경로(PII 탐지·원문 비노출·스키마 거부)는 하니스 스모크만으로 검증할 수 없다.
      - name: eval 린트
        if: needs.changes.outputs.backend == 'true'
        working-directory: eval
        run: ruff check harness.py judge.py tests pingpong

      - name: eval 포맷 검사
        if: needs.changes.outputs.backend == 'true'
        working-directory: eval
        run: ruff format --check harness.py judge.py tests pingpong

      - name: eval 테스트
        if: needs.changes.outputs.backend == 'true'
        working-directory: eval
        run: python -m pytest

      # eval이 server를 직접 import하는 구조라, 그 경계가 깨지지 않았는지 확인한다.
      - name: eval 하니스 스모크
        if: needs.changes.outputs.backend == 'true'
        working-directory: eval
        run: python harness.py

      # 필수 PR CI는 외부 모델의 비결정성·비용에 의존하지 않는다. CLI의 keyless skip 계약만 검사한다.
      - name: eval LLM judge 키 없는 스모크
        if: needs.changes.outputs.backend == 'true'
        working-directory: eval
        env:
          GEMINI_API_KEY: ''
          DAVI_EVAL_JUDGE_MODEL: ''
        run: python judge.py

      - name: Bicep 템플릿 빌드
        if: needs.changes.outputs.infrastructure == 'true'
        run: |
          az bicep install --version v0.46.1
          az bicep build --file infra/azure/dev-foundation.bicep --stdout >/dev/null
          az bicep build --file infra/azure/dev-server.bicep --stdout >/dev/null

      - name: 서버 이미지 빌드·비루트 확인·health 스모크
        if: needs.changes.outputs.infrastructure == 'true'
        run: |
          set -euo pipefail
          image="davi-server-ci:${GITHUB_SHA}"
          container="davi-server-ci-${GITHUB_RUN_ID}"
          docker build --tag "$image" server
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "davi"
          docker run --detach --rm \
            --name "$container" \
            --publish 127.0.0.1:8000:8000 \
            --env DAVI_ENV=development \
            --env DAVI_USE_STUB_LLM=true \
            --env DAVI_BIND_HOST=0.0.0.0 \
            --env DAVI_DEV_ACCESS_TOKEN=ci-only-not-a-secret-token-value-0001 \
            "$image"
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          # **아래 단언은 stdlib만 쓴다.** 잡을 합치면서 setup-python이 조건부가 됐다 —
          # infrastructure만 바뀐 PR에서는 러너 기본 인터프리터가 잡힌다. 여기 서드파티
          # import를 한 줄 넣으면 `server/app/**`을 건드린 PR에서만 통과하고 Dockerfile만
          # 고친 PR에서 ModuleNotFoundError로 죽는다 — 재현 조건이 "어느 파일을 건드렸나"라
          # 진단이 길어지는 종류다.
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:8000/health \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status") == "ok"; assert data.get("environment") == "development"; assert data.get("provider") == "gemini"; assert data.get("model") == "gemini-3.5-flash-lite"; assert data.get("stub_llm") is True; assert data.get("privacy_masking_disabled") is False'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
