name: CI

# PR과 main 푸시에서 실행한다. 바뀐 폴더의 잡만 돌린다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다(러너 낭비 방지).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 어느 스택이 바뀌었는지 판정한다. GitHub은 잡 단위 paths 필터를 지원하지 않아 이 잡이 대신한다.
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'app-android/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'server/**'
              - 'eval/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/eval-judge.yml'
              # 앱의 계약 파일이 바뀌어도 백엔드 잡을 돌린다.
              # test_contract_drift.py 가 이 파일을 읽어 서버 enum과 대조하기 때문이다.
              # 이게 없으면 앱만 고친 PR에서 드리프트 검사가 통째로 건너뛰어진다.
              - 'app-android/app/src/main/java/com/davi/helper/Contract.kt'
              - 'app-android/app/src/main/java/com/davi/helper/RequestTracing.kt'
            infrastructure:
              - 'server/Dockerfile'
              - 'server/.dockerignore'
              - 'server/requirements.txt'
              - 'server/requirements.lock.txt'
              - 'server/app/**'
              - 'infra/azure/**'
              - '.github/workflows/azure-dev-deploy.yml'
              - '.github/workflows/ci.yml'

  android:
    name: Android (debug/release APK + test)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      # wrapper jar는 바이너리다. 알려진 공식 배포본과 체크섬이 맞는지 먼저 검증한다.
      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v4

      # gradle/gradle-daemon-jvm.properties가 데몬 JVM을 Java 21로 고정한다.
      # 런처도 21로 맞춰 불필요한 JDK 재프로비저닝을 줄인다.
      # (vendor가 JETBRAINS라 데몬용 JDK는 Gradle이 foojay에서 따로 받아온다.)
      - name: JDK 21 셋업
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK 경로(ANDROID_HOME)와 라이선스 동의를 준비한다.
      # compileSdk 36 플랫폼은 AGP가 필요 시 자동 다운로드한다.
      - name: Android SDK 셋업
        uses: android-actions/setup-android@v3

      # 버전을 지정하지 않으면 wrapper(gradle-wrapper.properties)의 Gradle을 쓴다.
      # 캐시(~/.gradle)도 이 액션이 관리한다.
      - name: Gradle 셋업
        uses: gradle/actions/setup-gradle@v4

      # 실기기/Gemini 시나리오는 opt-in이지만 androidTest 소스와 APK는 키 없이 항상 컴파일한다.
      # assembleRelease는 preReleaseBuild를 거쳐 verifyReleaseConfiguration을 문다(#248) —
      # DAVI_RELEASE_ACCESS_TOKEN이 없으면 여기서 항상 실패하므로 CI 전용 더미값을 준다.
      - name: debug/release/test APK 빌드 + 단위 테스트
        env:
          DAVI_RELEASE_ACCESS_TOKEN: ci-only-not-a-secret-release-token-0001
        run: ./gradlew :app:assembleDebug :e2e-driver:assembleDebugAndroidTest :app:assembleRelease test

      # debug/release 산출물의 제품 경계를 산출물에서 직접 확인한다(#58). build.gradle.kts를
      # 읽어 확인하면 "설정이 있다"만 보이고 **패키징까지 실제로 갔는지**는 못 본다 —
      # 이 경계가 깨진 채 나간 빌드가 기기에서 서로를 밀어냈기 때문에 산출물로 고정한다.
      - name: debug/release 앱 식별자·이름 경계 확인
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)"
          test -n "$aapt2"

          badging() { "$aapt2" dump badging "$1"; }
          # 키를 오타내도 조용히 다른 값을 돌려주지 않게 갈래를 닫는다.
          meta() {
            case "$2" in
              applicationId) python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['applicationId'])" "$1" ;;
              outputFile)    python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['elements'][0]['outputFile'])" "$1" ;;
              *) echo "meta: 알 수 없는 키 $2" >&2; exit 1 ;;
            esac
          }
          appid() { meta "$1" applicationId; }

          # **`!` + `set -e`에 기대지 않는다.** bash는 `!`로 부정된 명령에 errexit를 적용하지
          # 않아(`set -e` 문서), `! cmd | grep -q PAT` 는 위반을 만나도 스텝을 죽이지 못한다.
          # 스크립트의 **마지막 명령일 때만** 종료 코드가 스텝 결과가 되어 우연히 동작한다 —
          # 그 밑에 한 줄만 덧붙이면 경계가 조용히 검사를 멈춘다(PR #281 리뷰에서 실측).
          # 각 검사를 스스로 exit 하는 게이트로 만들고, 어느 경계가 깨졌는지도 함께 찍는다.
          assert_absent() {  # $1=apk $2=패턴 $3=설명
            if badging "$1" | grep -q "$2"; then
              echo "release 경계 위반: $3 ($2)" >&2
              exit 1
            fi
          }
          # **파일명을 박지 않는다.** 서명 키가 없는 환경(CI·키 없는 팀원 PC)의 release 산출물은
          # app-release-unsigned.apk가 되어 이름이 달라진다. AGP가 실제 이름을 여기 적어 준다.
          apk_of() { echo "$(dirname "$1")/$(meta "$1" outputFile)"; }

          debug_meta=app/build/outputs/apk/debug/output-metadata.json
          release_meta=app/build/outputs/apk/release/output-metadata.json
          debug_apk="$(apk_of "$debug_meta")"
          release_apk="$(apk_of "$release_meta")"
          echo "debug=$debug_apk  release=$release_apk"
          test -f "$debug_apk" && test -f "$release_apk"

          # 앱 식별자 — 함께 설치되려면 서로 달라야 한다.
          test "$(appid "$debug_meta")" = com.davi.helper.debug
          test "$(appid "$release_meta")" = com.davi.helper

          # 앱 이름 — release는 제품 이름을 유지하고, debug 이름이 새어 들어가면 안 된다.
          debug_label="$(badging "$debug_apk" | sed -n "s/^application-label:'\(.*\)'$/\1/p")"
          release_label="$(badging "$release_apk" | sed -n "s/^application-label:'\(.*\)'$/\1/p")"
          test "$debug_label" = '다비 (개발)'
          test "$release_label" = '다비'

          # release 산출물에 debug 식별자·이름이 없다는 것을 반대 방향으로도 못박는다.
          assert_absent "$release_apk" 'com\.davi\.helper\.debug' 'debug 식별자가 release에 실렸다'
          assert_absent "$release_apk" '개발' 'debug 앱 이름이 release에 실렸다'

          # versionName 접미어도 같은 경계다 — 스토어에 -debug가 붙어 나가면 안 된다.
          # release 쪽도 접미어의 유무로만 좁힌다. `debug` 통짜로 보면 badging 출력 어디에
          # 그 글자가 스쳐도 이 경계와 무관한 이유로 빨개진다.
          badging "$debug_apk" | grep -qE "versionName='[^']*-debug'"
          assert_absent "$release_apk" "versionName='[^']*-debug'" 'release versionName에 -debug가 붙었다'

      - name: 실기기 결과 문서 렌더러 테스트
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          ./scripts/run-device-e2e.sh --list-scenarios

      - name: Windows PowerShell 실행기 구문·registry 테스트
        shell: pwsh
        run: ./scripts/run-device-e2e.ps1 -ListScenarios

      # .ps1은 BOM이 필수다. Windows PowerShell 5.1은 BOM이 없으면 한글 주석을 CP949로 읽어,
      # 구문이 멀쩡한데도 엉뚱한 줄에서 "Unexpected token '}'" 류로 죽는다.
      # .sh는 정반대로 BOM이 있으면 안 된다. `#!/usr/bin/env bash` 셔뱅이 깨져 실행되지 않는다.
      # 이 잡은 pwsh(7)로 돌아 두 문제 모두 재현하지 못하므로 바이트로 직접 확인한다.
      # (app-android 경로 필터로 도는 잡이라, 다른 폴더의 스크립트만 바뀐 PR에서는 돌지 않는다.)
      - name: 셸 스크립트 인코딩 검사 (.ps1 BOM 필수 / .sh BOM 금지)
        shell: pwsh
        run: |
          function Test-Bom([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            return ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
          }
          $ps1 = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.ps1)
          $sh = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.sh)
          $bad = @()
          $bad += @($ps1 | Where-Object { -not (Test-Bom $_.FullName) } |
            ForEach-Object { "BOM 없음 (.ps1은 필수): $($_.FullName)" })
          $bad += @($sh | Where-Object { Test-Bom $_.FullName } |
            ForEach-Object { "BOM 있음 (.sh는 금지 — 셔뱅이 깨진다): $($_.FullName)" })
          if ($bad) {
            $bad
            throw '셸 스크립트 인코딩 규칙 위반.'
          }
          ".ps1 $($ps1.Count)개(BOM 필수) / .sh $($sh.Count)개(BOM 금지) — 통과"

      - name: debug 평문 허용 host 제한
        env:
          DAVI_DEBUG_SERVER_URL: http://192.168.1.2:8000
          DAVI_DEBUG_ACCESS_TOKEN: ci-only-not-a-secret-token-value-0001
        run: |
          ./gradlew generateDebugNetworkSecurityConfig
          config="app/build/generated/res/network-security/debug/xml/network_security_config.xml"
          grep -q '<base-config cleartextTrafficPermitted="false"' "$config"
          grep -q '<domain includeSubdomains="false">192.168.1.2</domain>' "$config"
          test "$(grep -c 'cleartextTrafficPermitted="true"' "$config")" -eq 1

      - name: debug Azure HTTPS endpoint 허용
        env:
          DAVI_DEBUG_SERVER_URL: https://davi-server-dev.example.azurecontainerapps.io
          DAVI_DEBUG_ACCESS_TOKEN: ci-only-not-a-secret-token-value-0001
        run: |
          ./gradlew assembleDebug
          config="app/build/generated/res/network-security/debug/xml/network_security_config.xml"
          grep -q '<base-config cleartextTrafficPermitted="false"' "$config"
          ! grep -q 'cleartextTrafficPermitted="true"' "$config"
          ! grep -q '<domain-config' "$config"

      - name: debug 임의 HTTPS endpoint 거부
        env:
          DAVI_DEBUG_SERVER_URL: https://not-davi.example.com
          DAVI_DEBUG_ACCESS_TOKEN: ci-only-not-a-secret-token-value-0001
        run: |
          set +e
          output="$(./gradlew generateDebugNetworkSecurityConfig 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "Azure Container Apps 기본 endpoint" <<<"$output"

      - name: release에서 development 설정 거부
        env:
          DAVI_DEBUG_SERVER_URL: http://192.168.1.2:8000
          DAVI_DEBUG_ACCESS_TOKEN: ci-only-not-a-secret-token-value-0001
        run: |
          set +e
          output="$(./gradlew verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "release 빌드 전에" <<<"$output"

      # 서버가 development 프로필이라 release도 접근 토큰을 요구한다(#248). 세 경계를 각각 고정한다
      # — 미설정, 32자 미만, 정상값(통과 + BuildConfig 배선).
      - name: release 접근 토큰 미설정 거부
        run: |
          set +e
          output="$(./gradlew verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "DAVI_RELEASE_ACCESS_TOKEN을 설정하세요" <<<"$output"

      - name: release 접근 토큰 32자 미만 거부
        env:
          DAVI_RELEASE_ACCESS_TOKEN: ci-only-short-token-0001
        run: |
          set +e
          output="$(./gradlew verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "DAVI_RELEASE_ACCESS_TOKEN은 32자 이상이어야 합니다" <<<"$output"

      - name: release 접근 토큰 정상값 통과 및 BuildConfig 배선 확인
        env:
          DAVI_RELEASE_ACCESS_TOKEN: ci-only-not-a-secret-release-token-0001
        run: |
          ./gradlew verifyReleaseConfiguration
          ./gradlew :app:generateReleaseBuildConfig
          generated="app/build/generated/source/buildConfig/release/com/davi/helper/BuildConfig.java"
          test -f "$generated"
          grep -q 'DEV_ACCESS_TOKEN = "ci-only-not-a-secret-release-token-0001"' "$generated"

      # 마스킹 우회는 debug 전용이다(#203). release 경로에서는 값이 false여도 "설정이 있다는 것"
      # 자체를 실패로 본다 — 의도를 오인한 실행이기 때문이다. 두 입력 경로를 각각 확인한다.
      - name: release에서 마스킹 우회 속성 거부
        run: |
          set +e
          output="$(./gradlew -PdaviDisablePrivacyMasking=false verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "daviDisablePrivacyMasking" <<<"$output"

      - name: release에서 마스킹 우회 환경변수 설정 거부
        env:
          DAVI_DISABLE_PRIVACY_MASKING: 'false'
        run: |
          set +e
          output="$(./gradlew verifyReleaseConfiguration 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "DAVI_DISABLE_PRIVACY_MASKING" <<<"$output"

      # 위 관문이 release + 우회 속성 조합 자체를 막으므로, 여기서는 정상 release 산출물의
      # 상수가 false인지 본다. debug 값이 defaultConfig로 새는 배선 실수를 잡는 자리다.
      # generateReleaseBuildConfig도 preReleaseBuild를 거쳐 verifyReleaseConfiguration을
      # 물기 때문에(#248) 토큰이 없으면 이 단계도 실패한다.
      - name: release BuildConfig의 마스킹 상수 고정 확인
        env:
          DAVI_RELEASE_ACCESS_TOKEN: ci-only-not-a-secret-release-token-0001
        run: |
          ./gradlew :app:generateReleaseBuildConfig
          generated="app/build/generated/source/buildConfig/release/com/davi/helper/BuildConfig.java"
          test -f "$generated"
          grep -q 'PRIVACY_MASKING_DISABLED = false' "$generated"

      # 화면 요소의 label·bounds 상세 로그는 debug 전용이다(#58). 마스킹은 패턴 기반이라
      # 사람 이름·대화 내용처럼 패턴 밖 텍스트를 지우지 못하므로 "마스킹했으니 남겨도 된다"가
      # 성립하지 않는다. **포맷 문자열이 산출물에 없으면 그 줄은 절대 나올 수 없다** —
      # 소스를 읽는 정적 검사보다 이 편이 우회하기 어렵다.
      #
      # debug 쪽도 함께 본다. release만 검사하면 포맷이 바뀌었을 때 검사가 조용히 통과하는
      # 빈 관문이 된다 — 카나리아가 사라진 걸 실패로 잡아야 검사가 살아 있다.
      - name: release 산출물에 화면 상세 로그가 없는지 확인
        run: |
          dump() { unzip -p "$1" 'classes*.dex' | strings; }
          # **파일명을 박지 않는다.** 서명 키가 없는 환경(CI·키 없는 팀원 PC)의 release
          # 산출물은 app-release-unsigned.apk가 되어 이름이 달라진다. AGP가 output-metadata.json에
          # 실제 이름을 적어 주므로 거기서 유도한다.
          apk_of() {
            echo "$(dirname "$1")/$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['elements'][0]['outputFile'])" "$1")"
          }
          debug_apk="$(apk_of app/build/outputs/apk/debug/output-metadata.json)"
          release_apk="$(apk_of app/build/outputs/apk/release/output-metadata.json)"
          echo "debug=$debug_apk  release=$release_apk"
          test -f "$debug_apk" && test -f "$release_apk"

          # GuideScreenLog의 debug 구현만 쓰는 포맷이다. 바꾸면 이 목록도 함께 고친다.
          #
          # `at=`는 **highlight 좌표 전용**이다. 앞의 둘은 요소 덤프 경로 소속이라, highlight가
          # 좌표를 다시 찍어도 그 둘은 생기지 않아 검사가 통과해 버린다(PR #287 리뷰).
          # 요소 덤프의 `bounds=`를 카나리아로 쓸 수 없는 이유는 UiElement의 자동 생성
          # toString(`..., bounds=...`)이 release 산출물에도 남아 구분이 안 되기 때문이다.
          # **`!` + `set -e`에 기대지 않는다.** bash는 `!`로 부정된 명령에 errexit를 적용하지
          # 않으므로(`set -e` 문서), `! dump | grep -qF` 는 위반을 만나도 루프를 죽이지 못하고
          # **마지막 반복의 종료 코드만** 스텝 결과가 된다. 그래서 제일 중요한 첫 카나리아
          # (`label='` — release logcat에 화면 label 원문이 남지 않는다)의 위반이 통째로
          # 지나갔다(#293). 같은 결함을 「debug/release 앱 식별자·이름 경계 확인」 스텝이
          # assert_absent로 고쳤다(PR #281 리뷰).
          #
          # 두 스텝은 덤프 방식이 서로 달라(badging / dex strings) 헬퍼를 공유하지 않고 각자
          # 둔다. 대신 게이트의 모양과 이 근거 주석을 맞춘다 — 한쪽만 고치면 다른 쪽이 같은
          # 결함으로 되돌아간다.
          assert_present() {  # $1=apk $2=카나리아 $3=설명
            if ! dump "$1" | grep -qF "$2"; then
              echo "빈 관문: $3 — 카나리아 [$2]가 debug 산출물에 없다" >&2
              exit 1
            fi
          }
          assert_absent() {  # $1=apk $2=카나리아 $3=설명
            if dump "$1" | grep -qF "$2"; then
              echo "release 경계 위반: $3 — 카나리아 [$2]가 release 산출물에 있다" >&2
              exit 1
            fi
          }
          for canary in "label='" " scroll=" " at="; do
            assert_present "$debug_apk"   "$canary" 'debug 상세 로그 포맷이 사라졌다'
            assert_absent  "$release_apk" "$canary" '화면 상세 로그가 release에 실렸다'
          done

  backend:
    name: Backend (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: 의존성 설치
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # SPEC §5: 타입체커는 두지 않는다. 필요해지면 mypy를 추가하고 SPEC도 같이 고칠 것.
      - name: 린트
        working-directory: server
        run: ruff check .

      - name: 포맷 검사
        working-directory: server
        run: ruff format --check .

      - name: 테스트
        working-directory: server
        run: pytest

      # #30의 음성 경로(PII 탐지·원문 비노출·스키마 거부)는 하니스 스모크만으로 검증할 수 없다.
      - name: eval 린트
        working-directory: eval
        run: ruff check harness.py judge.py tests pingpong

      - name: eval 포맷 검사
        working-directory: eval
        run: ruff format --check harness.py judge.py tests pingpong

      - name: eval 테스트
        working-directory: eval
        run: python -m pytest

      # eval이 server를 직접 import하는 구조라, 그 경계가 깨지지 않았는지 확인한다.
      - name: eval 하니스 스모크
        working-directory: eval
        run: python harness.py

      # 필수 PR CI는 외부 모델의 비결정성·비용에 의존하지 않는다. CLI의 keyless skip 계약만 검사한다.
      - name: eval LLM judge 키 없는 스모크
        working-directory: eval
        env:
          GEMINI_API_KEY: ''
          DAVI_EVAL_JUDGE_MODEL: ''
        run: python judge.py

  infrastructure:
    name: Infrastructure (Docker + Bicep)
    needs: changes
    if: needs.changes.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep 템플릿 빌드
        run: |
          az bicep install --version v0.46.1
          az bicep build --file infra/azure/dev-foundation.bicep --stdout >/dev/null
          az bicep build --file infra/azure/dev-server.bicep --stdout >/dev/null

      - name: 서버 이미지 빌드·비루트 확인·health 스모크
        run: |
          set -euo pipefail
          image="davi-server-ci:${GITHUB_SHA}"
          container="davi-server-ci-${GITHUB_RUN_ID}"
          docker build --tag "$image" server
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "davi"
          docker run --detach --rm \
            --name "$container" \
            --publish 127.0.0.1:8000:8000 \
            --env DAVI_ENV=development \
            --env DAVI_USE_STUB_LLM=true \
            --env DAVI_BIND_HOST=0.0.0.0 \
            --env DAVI_DEV_ACCESS_TOKEN=ci-only-not-a-secret-token-value-0001 \
            "$image"
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --max-time 1 http://127.0.0.1:8000/health \
              | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status") == "ok"; assert data.get("environment") == "development"; assert data.get("provider") == "gemini"; assert data.get("model") == "gemini-3.5-flash-lite"; assert data.get("stub_llm") is True; assert data.get("privacy_masking_disabled") is False'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

  # 브랜치 보호의 필수 체크로 지정할 잡. 위 잡들이 조건부라 skipped가 되는데,
  # skipped는 필수 체크를 통과시키지 못하므로 여기서 한 번 집계한다.
  ci:
    name: CI 통과
    if: always()
    needs: [changes, android, backend, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: 결과 집계
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "android=${{ needs.android.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "infrastructure=${{ needs.infrastructure.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::실패했거나 취소된 잡이 있습니다."
            exit 1
          fi
          echo "모든 잡 통과(또는 해당 없음)."
