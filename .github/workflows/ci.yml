name: CI

# PR과 main 푸시에서 실행한다. 바뀐 폴더의 잡만 돌린다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다(러너 낭비 방지).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 어느 스택이 바뀌었는지 판정한다. GitHub은 잡 단위 paths 필터를 지원하지 않아 이 잡이 대신한다.
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'app-android/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'server/**'
              - 'eval/**'
              - '.github/workflows/ci.yml'

  android:
    name: Android (assembleDebug + test)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 셋업
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK 경로(ANDROID_HOME)와 라이선스 동의를 준비한다.
      # compileSdk 36 플랫폼은 AGP가 필요 시 자동 다운로드한다.
      - name: Android SDK 셋업
        uses: android-actions/setup-android@v3

      # gradle-wrapper.jar가 아직 저장소에 없어서 ./gradlew를 쓸 수 없다.
      # 대신 Gradle을 직접 설치해 `gradle` 명령을 쓴다.
      # TODO: wrapper jar를 추가하면 이 스텝을 gradle/actions/setup-gradle 기본값으로 바꾸고
      #       아래 명령을 ./gradlew 로 교체한 뒤 gradle/actions/wrapper-validation 스텝을 켤 것.
      #       (app-android/README.md 참고)
      - name: Gradle 셋업
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 빌드 + 단위 테스트
        run: gradle --no-daemon assembleDebug test

  backend:
    name: Backend (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: 의존성 설치
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # SPEC §5: 타입체커는 두지 않는다. 필요해지면 mypy를 추가하고 SPEC도 같이 고칠 것.
      - name: 린트
        working-directory: server
        run: ruff check .

      - name: 포맷 검사
        working-directory: server
        run: ruff format --check .

      - name: 테스트
        working-directory: server
        run: pytest

      # eval이 server를 직접 import하는 구조라, 그 경계가 깨지지 않았는지 확인한다.
      - name: eval 하니스 스모크
        working-directory: eval
        run: python harness.py

  # 브랜치 보호의 필수 체크로 지정할 잡. 위 잡들이 조건부라 skipped가 되는데,
  # skipped는 필수 체크를 통과시키지 못하므로 여기서 한 번 집계한다.
  ci:
    name: CI 통과
    if: always()
    needs: [changes, android, backend]
    runs-on: ubuntu-latest
    steps:
      - name: 결과 집계
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "android=${{ needs.android.result }}"
          echo "backend=${{ needs.backend.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::실패했거나 취소된 잡이 있습니다."
            exit 1
          fi
          echo "모든 잡 통과(또는 해당 없음)."
