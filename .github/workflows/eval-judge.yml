name: Eval judge observation

# 실제 모델 평가는 PR 필수 게이트가 아니다. main의 주간 관측과 명시적 수동 실행만 허용한다.
on:
  schedule:
    # 월요일 00:00 UTC = 한국시간 월요일 09:00
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      max_fixtures:
        description: 'accepted fixture 실행 상한(생략 시 judge.py 기본값)'
        required: false

permissions:
  contents: read

concurrency:
  group: eval-judge-observation
  cancel-in-progress: false

jobs:
  observe:
    name: Eval judge observation (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: 의존성 설치
        working-directory: eval
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 실제 후보 모델 + judge 관측
        working-directory: eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DAVI_EVAL_JUDGE_MODEL: ${{ vars.DAVI_EVAL_JUDGE_MODEL }}
          DAVI_MODEL_OPTIONAL: ${{ vars.DAVI_MODEL }}
          MAX_FIXTURES: ${{ inputs.max_fixtures }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$DAVI_EVAL_JUDGE_MODEL" ]; then
            echo "::error::실제 judge 관측에 필요한 secret 또는 model variable이 없습니다."
            exit 1
          fi
          if [ -n "$DAVI_MODEL_OPTIONAL" ]; then
            export DAVI_MODEL="$DAVI_MODEL_OPTIONAL"
          fi
          if [ -n "$MAX_FIXTURES" ]; then
            python judge.py --max-fixtures "$MAX_FIXTURES"
          else
            python judge.py
          fi
