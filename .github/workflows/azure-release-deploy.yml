name: Azure release deploy

# development는 main 변경 때 자동 배포한다. release는 검증한 main commit을 사람이 승격한다.
on:
  workflow_dispatch:

concurrency:
  group: azure-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: davi-release
    permissions:
      contents: read
      id-token: write
    env:
      DAVI_AZURE_RESOURCE_GROUP: ${{ vars.DAVI_AZURE_RESOURCE_GROUP }}
      DAVI_AZURE_ACR_NAME: ${{ vars.DAVI_AZURE_ACR_NAME }}
      DAVI_AZURE_KEY_VAULT_NAME: ${{ vars.DAVI_AZURE_KEY_VAULT_NAME }}
      DAVI_AZURE_MANAGED_ENVIRONMENT_NAME: ${{ vars.DAVI_AZURE_MANAGED_ENVIRONMENT_NAME }}
      DAVI_AZURE_CONTAINER_IDENTITY_NAME: ${{ vars.DAVI_AZURE_CONTAINER_IDENTITY_NAME }}
      DAVI_AZURE_CONTAINER_APP_NAME: ${{ vars.DAVI_AZURE_CONTAINER_APP_NAME }}
      DAVI_AZURE_AUTH_JWT_SECRET_NAME: ${{ vars.DAVI_AZURE_AUTH_JWT_SECRET_NAME }}
      DAVI_AZURE_KAKAO_APP_ID: ${{ vars.DAVI_AZURE_KAKAO_APP_ID }}
      DAVI_AZURE_LLM_PROVIDER: ${{ vars.DAVI_AZURE_LLM_PROVIDER }}
      DAVI_AZURE_OPENAI_KEY_SECRET_NAME: ${{ vars.DAVI_AZURE_OPENAI_KEY_SECRET_NAME }}
      DAVI_AZURE_MODEL: ${{ vars.DAVI_AZURE_MODEL }}
      IMAGE_REPOSITORY: davi-server

    steps:
      - uses: actions/checkout@v4

      - name: Azure 로그인
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: release 배포 변수 검증
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            DAVI_AZURE_RESOURCE_GROUP \
            DAVI_AZURE_ACR_NAME \
            DAVI_AZURE_KEY_VAULT_NAME \
            DAVI_AZURE_MANAGED_ENVIRONMENT_NAME \
            DAVI_AZURE_CONTAINER_IDENTITY_NAME \
            DAVI_AZURE_CONTAINER_APP_NAME \
            DAVI_AZURE_AUTH_JWT_SECRET_NAME \
            DAVI_AZURE_KAKAO_APP_ID; do
            test -n "${!name:-}" || {
              echo "::error::davi-release environment variable $name 을 설정하세요."
              exit 1
            }
          done

          if [ "$DAVI_AZURE_CONTAINER_APP_NAME" != "davi-server-release" ]; then
            echo "::error::release 환경의 DAVI_AZURE_CONTAINER_APP_NAME은 davi-server-release여야 합니다."
            exit 1
          fi
          if ! [[ "$DAVI_AZURE_KAKAO_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::DAVI_AZURE_KAKAO_APP_ID는 양의 정수여야 합니다."
            exit 1
          fi
          if [ -n "${DAVI_AZURE_MODEL:-}" ] && [ -z "${DAVI_AZURE_LLM_PROVIDER:-}" ]; then
            echo "::error::DAVI_AZURE_MODEL을 pin 하려면 DAVI_AZURE_LLM_PROVIDER도 함께 지정하세요."
            exit 1
          fi
          case "${DAVI_AZURE_LLM_PROVIDER:-gemini}" in
            gemini) ;;
            openai)
              test -n "${DAVI_AZURE_OPENAI_KEY_SECRET_NAME:-}" || {
                echo "::error::openai에는 DAVI_AZURE_OPENAI_KEY_SECRET_NAME이 필요합니다."
                exit 1
              }
              ;;
            *)
              echo "::error::release Azure 배선은 gemini 또는 openai만 지원합니다."
              exit 1
              ;;
          esac

      - name: 불변 image tag로 ACR push
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          login_server="$(az acr show \
            --name "$DAVI_AZURE_ACR_NAME" \
            --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)"
          test -n "$login_server"
          az acr login --name "$DAVI_AZURE_ACR_NAME"
          docker build \
            --platform linux/amd64 \
            --file server/Dockerfile \
            --tag "$login_server/$IMAGE_REPOSITORY:$image_tag" \
            server
          docker push "$login_server/$IMAGE_REPOSITORY:$image_tag"

      - name: release Container Apps revision 배포
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          revision_suffix="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          deployment_outputs="$(az deployment group create \
            --name "davi-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/release-server.bicep \
            --query properties.outputs \
            --output json \
            --parameters \
              containerAppName="$DAVI_AZURE_CONTAINER_APP_NAME" \
              managedEnvironmentName="$DAVI_AZURE_MANAGED_ENVIRONMENT_NAME" \
              acrName="$DAVI_AZURE_ACR_NAME" \
              keyVaultName="$DAVI_AZURE_KEY_VAULT_NAME" \
              containerIdentityName="$DAVI_AZURE_CONTAINER_IDENTITY_NAME" \
              imageTag="$image_tag" \
              revisionSuffix="$revision_suffix" \
              authJwtSecretSecretName="$DAVI_AZURE_AUTH_JWT_SECRET_NAME" \
              kakaoAppId="$DAVI_AZURE_KAKAO_APP_ID" \
              llmProvider="${DAVI_AZURE_LLM_PROVIDER:-gemini}" \
              openAiApiKeySecretName="${DAVI_AZURE_OPENAI_KEY_SECRET_NAME:-}" \
              daviModel="${DAVI_AZURE_MODEL:-}")"

          {
            printf 'revision=%s\n' "$(jq -er '.deployedRevision.value' <<<"$deployment_outputs")"
            printf 'image=%s\n' "$(jq -er '.deployedImage.value' <<<"$deployment_outputs")"
            printf 'fqdn=%s\n' "$(jq -er '.containerAppFqdn.value' <<<"$deployment_outputs")"
          } >> "$GITHUB_OUTPUT"

      - name: release revision과 HTTPS health 검증
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.deploy.outputs.revision }}
          EXPECTED_IMAGE: ${{ steps.deploy.outputs.image }}
          DEPLOYED_FQDN: ${{ steps.deploy.outputs.fqdn }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if az containerapp revision show \
              --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
              --name "$DAVI_AZURE_CONTAINER_APP_NAME" \
              --revision "$EXPECTED_REVISION" \
              --output json > /tmp/davi-release-revision 2>/dev/null \
              && jq -e \
                --arg expected_revision "$EXPECTED_REVISION" \
                --arg expected_image "$EXPECTED_IMAGE" \
                '.name == $expected_revision
                  and .properties.active == true
                  and .properties.provisioningState == "Provisioned"
                  and .properties.healthState == "Healthy"
                  and .properties.trafficWeight == 100
                  and .properties.template.containers[0].image == $expected_image
                  and any(.properties.template.containers[0].env[];
                    .name == "DAVI_ENV" and .value == "production")
                  and any(.properties.template.containers[0].env[];
                    .name == "DAVI_USE_STUB_LLM" and .value == "false")
                  and (all(.properties.template.containers[0].env[];
                    .name != "DAVI_DEV_ACCESS_TOKEN" and .name != "DAVI_TEST_ACCESS_TOKEN"))' \
                /tmp/davi-release-revision >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                --output /tmp/davi-release-health \
                "https://$DEPLOYED_FQDN/health" \
              && jq -e '.status == "ok" and length == 1' \
                /tmp/davi-release-health >/dev/null; then
              printf 'verified release revision: %s\n' "$EXPECTED_REVISION"
              printf 'verified release image: %s\n' "$EXPECTED_IMAGE"
              printf 'release URL: https://%s\n' "$DEPLOYED_FQDN"
              exit 0
            fi
            sleep 10
          done
          echo '::error::release revision/image/profile 또는 HTTPS health 확인에 실패했습니다.'
          exit 1
