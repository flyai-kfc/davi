name: Azure development deploy

# PR은 공유 서버를 바꾸지 않는다. main에 병합된 서버·인프라 변경과 명시적인 main 수동 실행만 배포한다.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "infra/azure/**"
      - ".github/workflows/azure-dev-deploy.yml"
  workflow_dispatch:

# 서로 다른 main 실행이 image와 revision을 엇갈리게 적용하지 않도록 배포를 직렬화한다.
concurrency:
  group: azure-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify
    # workflow_dispatch도 main 외의 ref에서는 공유 서버를 변경하지 않는다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: davi-development
    permissions:
      contents: read
      id-token: write
    env:
      DAVI_AZURE_RESOURCE_GROUP: ${{ vars.DAVI_AZURE_RESOURCE_GROUP }}
      DAVI_AZURE_ACR_NAME: ${{ vars.DAVI_AZURE_ACR_NAME }}
      DAVI_AZURE_KEY_VAULT_NAME: ${{ vars.DAVI_AZURE_KEY_VAULT_NAME }}
      DAVI_AZURE_MANAGED_ENVIRONMENT_NAME: ${{ vars.DAVI_AZURE_MANAGED_ENVIRONMENT_NAME }}
      DAVI_AZURE_CONTAINER_IDENTITY_NAME: ${{ vars.DAVI_AZURE_CONTAINER_IDENTITY_NAME }}
      DAVI_AZURE_CONTAINER_APP_NAME: ${{ vars.DAVI_AZURE_CONTAINER_APP_NAME }}
      # 외부 테스트 기간에만 채우는 **선택** 변수다. 비어 있으면 bicep 기본값과 같아져
      # 테스트 토큰이 배선되지 않는다 — 그래서 아래 필수 변수 검사 목록에는 넣지 않는다.
      # 이 자리가 없으면 테스트 기간에 손으로 배선한 토큰이 다음 main 푸시의 재배포에서
      # 조용히 사라진다(배포는 성공하고 참가자만 401이 되므로 로그에 단서가 없다).
      # secret **이름**은 비밀값이 아니라 vars로 충분하다.
      DAVI_AZURE_TEST_TOKEN_SECRET_NAME: ${{ vars.DAVI_AZURE_TEST_TOKEN_SECRET_NAME }}
      IMAGE_REPOSITORY: davi-server

    steps:
      - uses: actions/checkout@v4

      # client secret 없이 GitHub OIDC와 Azure federated credential로 로그인한다.
      - name: Azure 로그인
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 배포 변수 검증
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            DAVI_AZURE_RESOURCE_GROUP \
            DAVI_AZURE_ACR_NAME \
            DAVI_AZURE_KEY_VAULT_NAME \
            DAVI_AZURE_MANAGED_ENVIRONMENT_NAME \
            DAVI_AZURE_CONTAINER_IDENTITY_NAME \
            DAVI_AZURE_CONTAINER_APP_NAME; do
            test -n "${!name:-}" || {
              echo "::error::GitHub environment variable $name 을 설정하세요."
              exit 1
            }
          done

      - name: 불변 image tag로 ACR push
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          login_server="$(az acr show \
            --name "$DAVI_AZURE_ACR_NAME" \
            --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
            --query loginServer \
            --output tsv)"
          test -n "$login_server"

          az acr login --name "$DAVI_AZURE_ACR_NAME"
          docker build \
            --platform linux/amd64 \
            --file server/Dockerfile \
            --tag "$login_server/$IMAGE_REPOSITORY:$image_tag" \
            server
          docker push "$login_server/$IMAGE_REPOSITORY:$image_tag"

      - name: 고유 Container Apps revision 배포
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          revision_suffix="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          deployment_outputs="$(az deployment group create \
            --name "davi-server-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/dev-server.bicep \
            --query properties.outputs \
            --output json \
            --parameters \
              containerAppName="$DAVI_AZURE_CONTAINER_APP_NAME" \
              managedEnvironmentName="$DAVI_AZURE_MANAGED_ENVIRONMENT_NAME" \
              acrName="$DAVI_AZURE_ACR_NAME" \
              keyVaultName="$DAVI_AZURE_KEY_VAULT_NAME" \
              containerIdentityName="$DAVI_AZURE_CONTAINER_IDENTITY_NAME" \
              imageTag="$image_tag" \
              revisionSuffix="$revision_suffix" \
              testAccessTokenSecretName="${DAVI_AZURE_TEST_TOKEN_SECRET_NAME:-}")"

          deployed_revision="$(jq -er '.deployedRevision.value' <<<"$deployment_outputs")"
          deployed_image="$(jq -er '.deployedImage.value' <<<"$deployment_outputs")"
          container_app_fqdn="$(jq -er '.containerAppFqdn.value' <<<"$deployment_outputs")"
          {
            printf 'revision=%s\n' "$deployed_revision"
            printf 'image=%s\n' "$deployed_image"
            printf 'fqdn=%s\n' "$container_app_fqdn"
          } >> "$GITHUB_OUTPUT"

      # 이번 실행의 정확한 revision/image가 active·healthy·100% traffic인지 확인한 뒤 health를 본다.
      # 응답 본문과 비밀값은 로그에 출력하지 않는다.
      - name: 배포 revision과 HTTPS health 검증
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.deploy.outputs.revision }}
          EXPECTED_IMAGE: ${{ steps.deploy.outputs.image }}
          DEPLOYED_FQDN: ${{ steps.deploy.outputs.fqdn }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_REVISION"
          test -n "$EXPECTED_IMAGE"
          test -n "$DEPLOYED_FQDN"

          for attempt in $(seq 1 18); do
            if az containerapp revision show \
              --resource-group "$DAVI_AZURE_RESOURCE_GROUP" \
              --name "$DAVI_AZURE_CONTAINER_APP_NAME" \
              --revision "$EXPECTED_REVISION" \
              --output json > /tmp/davi-deployed-revision 2>/dev/null \
              && jq -e \
                --arg expected_revision "$EXPECTED_REVISION" \
                --arg expected_image "$EXPECTED_IMAGE" \
                '.name == $expected_revision
                  and .properties.active == true
                  and .properties.provisioningState == "Provisioned"
                  and .properties.healthState == "Healthy"
                  and .properties.trafficWeight == 100
                  and .properties.template.containers[0].image == $expected_image' \
                /tmp/davi-deployed-revision >/dev/null \
              && curl --fail --silent --show-error --max-time 10 \
                --output /tmp/davi-health-response \
                "https://$DEPLOYED_FQDN/health" \
              && jq -e \
                '.status == "ok" and .environment == "development" and .stub_llm == false' \
                /tmp/davi-health-response >/dev/null; then
              printf 'verified revision: %s\n' "$EXPECTED_REVISION"
              printf 'verified image: %s\n' "$EXPECTED_IMAGE"
              printf 'shared development URL: https://%s\n' "$DEPLOYED_FQDN"
              exit 0
            fi
            sleep 10
          done
          echo '::error::이번 배포 revision/image 또는 Container App health 확인에 실패했습니다.'
          exit 1
