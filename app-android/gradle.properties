org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 큰 프로젝트에서 임포트 성능을 올린다. AGP가 켜라고 권고한다.
android.dependency.excludeLibraryComponentsFromConstraints=true
android.dependency.useConstraints=true

# --- AGP 9 마이그레이션 호환 플래그 ---
# 아래 둘은 "옛 동작을 유지"하는 스위치다. AGP가 deprecated로 경고하지만,
# 지금 끄면 DSL과 Kotlin 플러그인 적용 방식이 통째로 바뀌어 빌드 구조를 손봐야 한다.
# 별도 작업으로 다루고, 그때 이 두 줄을 지운다.
android.newDsl=false
android.builtInKotlin=false

# 나머지 마이그레이션 플래그(usesSdkInManifest.disallowed, defaultTargetSdkToCompileSdkIfUnset,
# enableAppCompileTimeRClass, r8.optimizedResourceShrinking, defaults.buildfeatures.resvalues,
# uniquePackageNames, r8.strictFullModeForKeepRules)는 전부 지웠다.
# 우리 설정과 무관하거나(targetSdk를 명시하고 uses-sdk를 매니페스트에 두지 않는다),
# 기본값과 같아서 경고만 만들고 있었다.
