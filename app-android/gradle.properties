org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 큰 프로젝트에서 임포트 성능을 올린다. AGP가 켜라고 권고한다.
android.dependency.excludeLibraryComponentsFromConstraints=true
android.dependency.useConstraints=true

# --- AGP 9 마이그레이션 호환 플래그 (deprecated 경고가 나지만 지금은 지울 수 없다) ---
#
# 이 둘은 커플링돼 있다. newDsl만 켜보니 빌드가 이렇게 깨진다(실측, CI):
#
#   Failed to apply plugin 'org.jetbrains.kotlin.android'.
#   > class ...ApplicationExtensionImpl$AgpDecorated_Decorated
#     cannot be cast to class com.android.build.gradle.BaseExtension
#
# KGP 2.2.10의 kotlin-android 플러그인이 AGP 9의 새 DSL을 모른다. 옛 BaseExtension으로
# 캐스팅하려다 실패한다. 새 DSL을 쓰려면 외부 Kotlin 플러그인을 버리고 AGP 내장 Kotlin
# (builtInKotlin)으로 가야 하는데, 그러면 serialization 플러그인 적용 방식까지 함께 바뀐다.
#
# 즉 상류가 막고 있다. 걷어낼 조건은 둘 중 하나다.
#   - KGP가 AGP 9 새 DSL을 지원하는 버전으로 올라오거나
#   - AGP 내장 Kotlin이 serialization 플러그인을 지원한다고 확인되거나
# 그때 이 두 줄과 이 주석을 같이 지운다. 지금은 경고 2줄을 감수한다.
android.newDsl=false
android.builtInKotlin=false

# 나머지 마이그레이션 플래그(usesSdkInManifest.disallowed, defaultTargetSdkToCompileSdkIfUnset,
# enableAppCompileTimeRClass, r8.optimizedResourceShrinking, defaults.buildfeatures.resvalues,
# uniquePackageNames, r8.strictFullModeForKeepRules)는 전부 지웠다.
# 우리 설정과 무관하거나(targetSdk를 명시하고 uses-sdk를 매니페스트에 두지 않는다),
# 기본값과 같아서 경고만 만들고 있었다.
